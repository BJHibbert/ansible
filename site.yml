---
- hosts: all
  become: true
  pre_tasks:

  - name: Install updates for Fedora
    tags: always
    ansible.builtin.dnf:
      name: "*"
      state: latest
      update_cache: yes
    when: ansible_facts['os_family'] == "RedHat"

  - name: Install updates for Debian
    tags: always
    ansible.builtin.apt:
      update_cache: yes
      upgrade: dist
    when: ansible_facts['os_family'] == "Debian"

- hosts: all
  become: true
  roles:
    - base

- hosts: all
  become: yes
  become_user: bjhibbert
  tasks:

  - name: Check if cinnamon is installed
    ansible.builtin.stat:
      path: /usr/bin/cinnamon
    register: cinnamon_stat

  - name: Apply role if cinnamon is installed
    ansible.builtin.include_role:
      name: cinnamon
    when: cinnamon_stat.stat.exists

